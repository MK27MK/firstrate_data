repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.6      
  hooks:
    # Run the linter.
    - id: ruff-check
      args: [ --fix, --ignore, D ] # ignoring docstring errors for speed of development
      # types_or: [ python, pyi ] # exclude jupyter notebooks      
    # Run the formatter.
    - id: ruff-format 
      # types_or: [ python, pyi ] # exclude jupyter notebooks    

